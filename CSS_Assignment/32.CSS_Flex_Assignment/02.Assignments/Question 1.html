<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
        box-sizing: border-box;
        }

        .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        height: 80px;
        padding: 0 30px;
        background: #222;
        color: white;
        }

        .logo {
        font-size: 24px;
        font-weight: bold;
        white-space: nowrap;
        }

        .nav-links {
        display: flex;
        list-style: none;
        padding: 0;
        margin: 0;
        gap: 25px;
        flex-wrap: nowrap;
        }

        .nav-links li {
        display: block;
        white-space: nowrap;
        }

        .auth-buttons {
        display: flex;
        gap: 10px;
        }

        button {
        padding: 10px 18px;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo">CodeAcademy</div>

        <ul class="nav-links">
            <li>Home</li>
            <li>Courses</li>
            <li>Projects</li>
            <li>Contact</li>
        </ul>

        <div class="auth-buttons">
            <button>Login</button>
            <button>Signup</button>
        </div>
    </header>
    
</body>
</html>
