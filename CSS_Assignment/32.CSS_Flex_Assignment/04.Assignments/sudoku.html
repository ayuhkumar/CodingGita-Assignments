        body {

            background-color: white;
            margin: 0;
            padding: 60px 20px;

        .main {
            display: flex;
            justify-content: center;
            gap: 32px;
            flex-wrap: wrap;
        }

        .box {
            width: 296px;
        }

        h2 {
            text-align: center;
            font-size: 23px;
            font-weight: normal;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: repeat(9, 1fr);
            width: 294px;
            height: 294px;
            border: 2px solid #222;
        }

        .cell {
            border: 1px solid #888;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 23px;
            color: #222;
            box-sizing: border-box;
        }

        .green {
            background-color: #a8d5b9;
        }

        /* Make every third column border thicker */
        .cell:nth-child(3n) {
            border-right: 2px solid #222;
        }

        /* Make every third row border thicker */
        .cell:nth-child(n+19):nth-child(-n+27),
        .cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #222;
        }

        .grid .cell:nth-child(3n+1) {
            border-left: 1px solid #888;
        }
    </style>
</head>
